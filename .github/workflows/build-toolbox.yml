name: Build toolbox

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build toolbox ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-13
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Build toolbox builder
        shell: bash
        run: |
          set -euo pipefail
          cd toolbox
          go build -o toolbox-builder

      - name: Build toolbox archive (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cd toolbox
          ./toolbox-builder --playbook ../playbook/60-second-linux.yaml --out .

      - name: Build toolbox archive (Darwin)
        if: matrix.os == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          cd toolbox
          ./toolbox-builder --playbook ../playbook/60-second-darwin.yaml --out .

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolbox.${{ matrix.os }}.${{ matrix.arch }}
          path: toolbox/*.tar.xz
          if-no-files-found: error
          retention-days: 7


